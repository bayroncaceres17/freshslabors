<div class="modal-header">
  <h5 class="modal-title">Editar horas — {{ emp.nombre }}</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
</div>

<div class="modal-body">
  {% if tareas|length == 0 %}
    <div class="text-muted">No tiene tareas asignadas activas.</div>
  {% endif %}

  {% for t in tareas %}
  <div class="card mb-3">
    <div class="card-header d-flex justify-content-between align-items-center">
      <div>
        <div class="fw-semibold">#{{ t.id }} · {{ t.nombre }}</div>
        <div class="small text-muted">{{ t.ubicacion or '' }}</div>
      </div>
      <div class="small text-muted">Tarifa: ${{ '%.2f'|format(t.tarifa or 0) }}/h</div>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-sm mb-0">
          <thead class="table-light">
            <tr>
              <th>Fecha</th>
              <th class="text-end">Horas</th>
              <th class="text-end">Ganado</th>
              <th class="text-center">Acción</th>
            </tr>
          </thead>
          <tbody id="tb-{{ t.id }}">
            <tr><td colspan="4" class="text-muted text-center py-3">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  {% endfor %}
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
</div>

<script>
(async () => {
  const uid = {{ emp.id }};
  const days = 14;

  // Carga por tarea usando tu JSON /admin/tarea/<tid>/horas-por-fecha/<uid>  (o el otro JSON similar)
  const cards = Array.from(document.querySelectorAll('tbody[id^="tb-"]'));
  for (const tb of cards) {
    const tid = parseInt(tb.id.replace("tb-",""),10);
    const url = `{{ url_for('admin_horas_por_fecha', tid=0, uid=emp.id) }}`.replace('/0/','/'+tid+'/') + `?days=${days}`;
    try {
      const r = await fetch(url, {headers:{'X-Requested-With':'fetch'}});
      const js = await r.json();
      tb.innerHTML = "";
      (js.rows || []).forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><span class="badge bg-light text-dark">${row.fecha}</span></td>
          <td class="text-end">${(row.horas ?? 0).toFixed(2)}h</td>
          <td class="text-end">$${(row.ganado ?? 0).toFixed(2)}</td>
          <td class="text-center">
            <a class="btn btn-sm btn-outline-primary" target="_blank"
               href="{{ url_for('admin_horas_editar_dia') }}?uid=${uid}&tarea_id=${tid}&fecha=${row.fecha}">
              Editar día
            </a>
          </td>`;
        tb.appendChild(tr);
      });
      if(!tb.children.length){
        tb.innerHTML = `<tr><td colspan="4" class="text-muted text-center py-3">Sin días en este rango.</td></tr>`;
      }
    } catch {
      tb.innerHTML = `<tr><td colspan="4" class="text-muted text-center py-3">Error cargando datos.</td></tr>`;
    }
  }
})();
</script>
