<div class="modal-header">
  <h5 class="modal-title">
    Editar horas — Tarea #{{ tarea.id }} · {{ tarea.nombre }} — {{ fecha.strftime('%Y-%m-%d') }}
  </h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
</div>

<form id="formEditSimple" method="post" action="{{ url_for('admin_horas_editar_simple_post') }}">
  <div class="modal-body">
    <input type="hidden" name="tarea_id" value="{{ tarea.id }}">
    <input type="hidden" name="fecha" value="{{ fecha.strftime('%Y-%m-%d') }}">

    <div class="d-flex gap-2 mb-3">
      <div class="input-group input-group-sm" style="max-width:220px;">
        <span class="input-group-text">HH:MM para todos</span>
        <input type="text" class="form-control" id="hhmm_all" placeholder="08:00">
        <button class="btn btn-outline-secondary" type="button" id="btnApplyAll">Aplicar</button>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" id="lunch_all">
        <label class="form-check-label" for="lunch_all">Marcar Lunch a todos</label>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-sm align-middle">
        <thead class="table-light">
          <tr>
            <th>Empleado</th>
            <th style="width:140px;">HH:MM neto</th>
            <th style="width:140px;">Lunch</th>
          </tr>
        </thead>
        <tbody>
          {% for r in rows %}
          <tr>
            <td>
              <div class="fw-semibold">{{ r.nombre }}</div>
              <div class="text-muted small">{{ r.tel or '—' }}</div>
            </td>
            <td>
              <input name="hhmm_{{ r.uid }}" class="form-control form-control-sm" placeholder="hh:mm"
                     value="{{ r.hhmm }}">
            </td>
            <td>
              <div class="form-check">
                <input class="form-check-input" type="checkbox"
                       name="lunch_{{ r.uid }}" id="lunch_{{ r.uid }}"
                       {{ 'checked' if r.lunch_on else '' }}>
                <label class="form-check-label small" for="lunch_{{ r.uid }}">
                  {{ r.lunch_min }} min
                </label>
              </div>
            </td>
          </tr>
          {% else %}
          <tr><td colspan="3" class="text-center text-muted py-4">Sin asignados en esta tarea.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
    <button type="submit" class="btn btn-primary" id="btnSaveSimple">Guardar</button>
  </div>
</form>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const form = $("#formEditSimple");
  const tareaId = form.querySelector('input[name="tarea_id"]').value;

  // Aplicar HH:MM a todas las filas visibles
  $("#btnApplyAll")?.addEventListener("click", () => {
    const val = ($("#hhmm_all")?.value || "").trim();
    if (!val) return;
    $$('input[name^="hhmm_"]').forEach(inp => inp.value = val);
  });

  // Marcar/Desmarcar lunch a todas
  $("#lunch_all")?.addEventListener("change", (e) => {
    const on = e.target.checked;
    $$('input[type="checkbox"][name^="lunch_"]').forEach(cb => cb.checked = on);
  });

  // Guardar por fetch (evita recargar)
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const res = await fetch(form.action + "?vista=tabla", {
      method: "POST",
      headers: { "X-Requested-With":"fetch" },
      body: fd
    });
    const js = await res.json().catch(()=>({ok:false,error:"Error"}));
    if (js.ok) {
      // feedback rápido
      const btn = document.getElementById("btnSaveSimple");
      const prev = btn.textContent;
      btn.disabled = true; btn.textContent = "Guardado ✓";
      setTimeout(()=>{ btn.disabled=false; btn.textContent=prev; }, 900);
    } else {
      alert(js.error || "No se pudo guardar");
    }
  });
})();
</script>
