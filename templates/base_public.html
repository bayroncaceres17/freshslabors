<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Fresh’s Labors{% endblock %}</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
  :root{
    --bg:#f3f6ff;--card:#fff;--border:#e9ecf8;--shadow:0 10px 24px rgba(27,55,130,.08);
    --brand:#2e62ff;--muted:#6b7280;
  }
  body{min-height:100vh;background:linear-gradient(135deg,#2e62ff,#3b35c3) fixed;}
  [data-bs-theme="light"] body{ background:linear-gradient(135deg,#eef2ff,#eaf0ff) fixed; }  /* <--- NUEVO */
  .glass{background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.6);border-radius:14px;}
</style>

  {% block head %}{% endblock %}
</head>
<body>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% if msgs %}
      <div class="container pt-3">
        {% for cat,msg in msgs %}
          <div class="alert alert-{{ 'warning' if cat=='warn' else cat }} shadow-sm">{{ msg|safe }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
